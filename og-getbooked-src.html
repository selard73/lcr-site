<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:'Special Elite',monospace}
.og{width:1200px;height:630px;background:#1B1A17;display:grid;grid-template-columns:1fr 430px;align-items:center;padding-left:70px;box-sizing:border-box;position:relative}
.eyebrow{color:#D9CDAF;font-size:19px;letter-spacing:3px;text-transform:uppercase}
h1{font-family:Anton;color:#F3ECDA;font-size:96px;margin:10px 0 16px;letter-spacing:2px;line-height:.95;text-transform:uppercase}
h1 em{font-style:normal;color:#C4302B}
.sub{color:#D9CDAF;font-size:24px;max-width:26ch;line-height:1.5;margin:0}
.free{display:inline-block;margin-top:24px;font-family:Anton;color:#C4302B;border:5px double #C4302B;padding:6px 18px;font-size:30px;letter-spacing:2px;transform:rotate(-3deg);background:#F3ECDA}
.card{width:340px;background:#b6b4ad;border:5px solid #F3ECDA;box-shadow:0 24px 60px rgba(0,0,0,.65);transform:rotate(3deg);position:relative;justify-self:center;
  background-image:repeating-linear-gradient(0deg,transparent 0 52px,rgba(60,58,52,.5) 52px 54px)}
.card img{width:100%;height:300px;object-fit:cover;object-position:center top;display:block}
.strip{position:absolute;top:14px;left:12px;z-index:2;background:#f3ecda;border:3px solid #1b1a17;font-size:17px;padding:5px 10px;transform:rotate(-3deg);color:#1b1a17}
.stamp{position:absolute;top:64px;right:-14px;z-index:2;transform:rotate(10deg);color:#c4302b;border:5px double #c4302b;padding:2px 10px;font-family:Anton;font-size:26px;text-align:center;line-height:1.05;background:rgba(243,236,218,.85)}
.stamp small{display:block;font-family:Oswald;font-weight:700;font-size:12px;letter-spacing:2px}
.sign{margin:-34px auto 14px;position:relative;width:82%;background:linear-gradient(#a6773f,#7a5230);border:5px solid #4e3218;border-radius:6px;text-align:center;color:#f3ecda;padding:8px 4px 10px}
.sign b{font-family:Oswald;font-weight:700;font-size:15px;letter-spacing:1px}
.sign .id{font-family:Anton;font-size:30px;display:block;line-height:1.1}
.foot{background:#1b1a17;color:#d9cdaf;text-align:center;font-family:Oswald;font-weight:700;font-size:13px;letter-spacing:1px;padding:8px 0}
.seal{position:absolute;left:330px;bottom:36px;width:86px;height:86px;border-radius:50%;border:3px solid #F3ECDA}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#B8231F}
</style>
<div class="og">
  <div>
    <p class="eyebrow">★ Department of Pawctions ★</p>
    <h1>Get your pet<br><em>booked.</em></h1>
    <p class="sub">Upload their photo. The court assigns the charge. Post the mugshot proudly.</p>
    <span class="free">100% FREE</span>
  </div>
  <div class="card">
    <span class="strip">CHARGE: EXCESSIVE ZOOMIES</span>
    <span class="stamp">WANTED<small>FOR A BETTER LIFE</small></span>
    <img src="img/dogs/blue.jpg">
    <div class="sign"><b>LAST CHANCE RANCH PRISON</b><span class="id">ID# 34 · YOUR PET</span></div>
    <div class="foot">LASTCHANCERANCHSC.COM · #GETBOOKED</div>
  </div>
  <img class="seal" src="img/seal.jpg"><div class="bar"></div>
</div>
